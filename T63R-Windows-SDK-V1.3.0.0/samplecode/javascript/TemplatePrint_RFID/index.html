<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TemplatePrint_RFID</title>
    <link rel="stylesheet" type="text/css" href="./css/reset.css" />
    <link rel="stylesheet" type="text/css" href="./css/style.css" />
</head>

<body>
    <div class="header">
        <img src="./images/tp.png" height="32px" style="margin-top:16px;" />
    </div>
    <div class="main">
        <span class="tag">
            TemplatePrint_RFID
        </span>
        <div class="content_wrap">
            <div class="setting">
                <p class="title">模板文件：</p>
                <div class="file_input border">
                    <input style="display: none;" type="file" name="tmplFileSrc" id="tmplFileSrc" />
                    <input type="text" id="tempDisplay" readonly />
                    <button onclick="chooseTemp('tmplFileSrc')">浏览</button>
                </div>
                <p class="title">填写真实数据：</p>
                <div class="data_set border">
                    <div class="wrap">
                        <section>
                            <div class="set_label" style="flex: 1; margin-right: 45px">
                                <label for="elemID1">元素id</label>
                                <input type="text" id="elemID1" name="elemID1">
                            </div>
                            <div class="set_label" style="flex: 2;">
                                <label for="actualData1">真实数据内容</label>
                                <input type="text" id="actualData1" name="actualData1" class="contentInput">
                            </div>
                        </section>
                        <section>
                            <div class="set_label" style="flex: 1; margin-right: 45px">
                                <label for="elemID2">元素id</label>
                                <input type="text" id="elemID2" name="elemID2">
                            </div>
                            <div class="set_label" style="flex: 2;">
                                <label for="actualData2">真实数据内容</label>
                                <input type="text" id="actualData2" name="actualData2" class="contentInput">
                            </div>
                        </section>
                        <section>
                            <div class="set_label" style="flex: 1; margin-right: 45px">
                                <label for="elemID3">元素id</label>
                                <input type="text" id="elemID3" name="elemID3">
                            </div>
                            <div class="set_label" style="flex: 2;">
                                <label for="actualData3">真实数据内容</label>
                                <input type="text" id="actualData3" name="actualData3" class="contentInput">
                            </div>
                        </section>
                    </div>
                </div>
                <p class="title">打印设置：</p>
                <div class="options border">                   
                    <div class="label">
                        <label for="printCount" style=" margin-left: 55px;margin-right: 50px">打印次数</label>
                        <input type="number" id="printCount" name="printCount" value="1">
                    </div>

                </div>

                <div class="data_set border">
                    <div class="wrap">                                        
                        <section>   
                            <label for="EMU_SEL" style=" margin-right: 50px;">仿真选择</label>    
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" id="ZPL_EMU" value="1" name="EMU_RADIO" checked>
                                <label for="ZPL" name="ZPL">ZPL</label>
                            </div>                         
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" id="TSPL_EMU" value="2" name="EMU_RADIO" >
                                <label for="TSPL" name="TSPL">TSPL</label>
                            </div>
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" id="ESCPOS_EMU" value="3" name="EMU_RADIO">
                                <label for="ESCPOS" name="ESCPOS">ESCPOS</label>
                            </div>                            
                        </section>
                    </div>
                </div>

                <div class="btn"><button class="success" onclick="handlePrint()">打印</button></div>
                <div class="terminal_wrap">
                    <div class="top">
                        <p class="title">信息输出：</p>
                        <button onclick="clearLog()">清空输出</button>
                    </div>
                    <div class="terminal border">
                    </div>
                </div>

            </div>

        </div>
    </div>


    <div class="popup_tips" style="display: none;">
        <div class="popup_tips_mask"></div>
        <div class="popup_tips_content"></div>
    </div>

</body>

<script src="./js/jquery.js"></script>
<script src="./js/common.js"></script>
<script type="text/javascript">

    window.onload = function () {    //刷新后回到顶部
        $(window).scrollTop(0)
    }

    //开始打印
    async function handlePrint() {
        var data = {};
        $("input[name]").each(function () {
            var name = $(this).attr("name");
            var isFile = $(this).attr("type") == "file";
            var isRadio = $(this).attr("type") == "radio";
            var isCheckBox = $(this).attr("type") == "checkbox";
            if (isFile) {
                data[name] = $("input[name=" + name + "]").get(0).files[0] || "";
            } else if (isCheckBox) {
                data[name] = $(this).is(":checked")
            } else if (isRadio) {
                data[name] = $("input[name=" + name + "]:checked").val()
            } else {
                data[name] = $("input[name=" + name + "]").val() || "";
            }
        });


        if (!data.tmplFileSrc) {
            openMask("请选择模板文件", true)
            return
        }

        print(await handleParams(data))
    }
    async function handleParams(data) {

        data.tmplFileSrc = await fileToBase64(data.tmplFileSrc)

        return data
    }

    //开始打印
    async function print(params) {
        console.log(params);
        try {
            await sendPostRequest("web_DSTP2x_SetLibLang", "设置语言", { "language":"0" })
            
            //枚举设备
            const devRes = await sendPostRequest("web_DSTP2x_EnumDev", "枚举设备", { "enumType": "1" })
            
            let index = devRes.enumList.indexOf(",")
            if(index != -1)
            {
                const devList = devRes.enumList.split(",")
                devRes.enumList = devList[0]
            }

            //连接设备
            const connectRes = await sendPostRequest("web_DSTP2x_ConnEnumeratedDev", "连接设备", { "devName": devRes.enumList })

            //获取打印状态
            const statusRes = await sendPostRequest("web_DSTP2x_GetPrtStatus", "获取打印状态", { "devHdl": connectRes.devHdl })
            if (statusRes.isReady != "1") {
                openMask("打印机状态异常", true)
                //断开连接
                await sendPostRequest("web_DSTP2x_DisconnDev", "断开连接", { "devHdl": connectRes.devHdl })
                return
            }
            //设置仿真类型
            await sendPostRequest("web_DSTP2x_SetPrnEmulation", "设置仿真类型", { "devHdl": connectRes.devHdl, "emulation": params.EMU_RADIO })

            //设置超时时间
            await sendPostRequest("web_DSTP2x_SetCommTimeout", "设置超时时间", {
                "devHdl": connectRes.devHdl, "commType": "1", "sendTimeout": "20000", "recvTimeout": "20000"
            })

            //加载模板
            const tempRes = await sendPostRequest("web_DSTP2x_LoadLabelTmpl", "加载模板", { "tmplFileSrcType": "1", "tmplFileSrc": params.tmplFileSrc })

            if (params.elemID1 && params.actualData1) {
                await sendPostRequest("web_DSTP2x_SetTmplPrnData", "设置模板", {
                    "tmplHdl": tempRes.tmplHdl, "elemID": params.elemID1, "actualData": params.actualData1
                })
            }
            if (params.elemID2 && params.actualData2) {
                await sendPostRequest("web_DSTP2x_SetTmplPrnData", "设置模板", {
                    "tmplHdl": tempRes.tmplHdl, "elemID": params.elemID2, "actualData": params.actualData2
                })
            }
            if (params.elemID3 && params.actualData3) {
                await sendPostRequest("web_DSTP2x_SetTmplPrnData", "设置模板", {
                    "tmplHdl": tempRes.tmplHdl, "elemID": params.elemID3, "actualData": params.actualData3
                })
            }
            printTemp(connectRes, tempRes, params, 1)
        } catch (error) {
            let errText = error ? error : "请求失败"
            openMask(errText, true)
        }
    }

    //循环打印
    async function printTemp(connectRes, tempRes, params, count) {
        try {
            if (count <= params.printCount) {
                //打印
                await sendPostRequest("web_DSTP2x_PrintTmpl", `第${count}次打印`, { "devHdl": connectRes.devHdl, "tmplHdl": tempRes.tmplHdl, "outFileType": "0" })
                count++
                printTemp(connectRes, tempRes, params, count)
            } else {
                //删除模板句柄
                await sendPostRequest("web_DSTP2x_DeleteTmpl", "删除模板句柄", { "tmplHdl": tempRes.tmplHdl })
                //断开连接
                await sendPostRequest("web_DSTP2x_DisconnDev", "断开连接", { "devHdl": connectRes.devHdl })
                openMask("打印模板成功", true)
                // reset()
            }
        } catch (error) {
            let errText = error ? error : "请求失败"
            openMask(errText, true)
        }
    }
</script>

</html>
