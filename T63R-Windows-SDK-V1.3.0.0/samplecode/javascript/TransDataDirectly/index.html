<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransDataDirectly</title>
    <link rel="stylesheet" type="text/css" href="./css/reset.css" />
    <link rel="stylesheet" type="text/css" href="./css/style.css" />
</head>

<body>
    <div class="header">
        <img src="./images/tp.png" height="32px" style="margin-top:16px;" />
    </div>
    <div class="main">
        <span class="tag">
            TransDataDirectly
        </span>
        <div class="content_wrap">
            <div class="setting">               
                <p class="title">打印设置：</p>
                <div class="options border">
                    <div class="label">                        
                        <label for="printCount" style=" margin-left: 55px;margin-right: 50px">打印次数</label>
                        <input type="number" id="printCount" value="1" name="printCount">
                        <button class="success" onclick="handlePrint('打印')">打印</button>
                    </div>
                </div>

                <div class="data_set border">
                    <div class="wrap">                                        
                        <section>   
                            <label for="EMU_SEL" style=" margin-right: 50px;">仿真选择</label>    
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" id="ZPL_EMU" value="1" name="EMU_RADIO" checked onclick="changeDataValue(1)">
                                <label for="ZPL" name="ZPL">ZPL</label>
                            </div>                         
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" id="TSPL_EMU" value="2" name="EMU_RADIO" onclick="changeDataValue(2)">
                                <label for="TSPL" name="TSPL">TSPL</label>
                            </div>
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" id="ESCPOS_EMU" value="3" name="EMU_RADIO" onclick="changeDataValue(3)">
                                <label for="ESCPOS" name="ESCPOS">ESCPOS</label>
                            </div>                            
                        </section>
                    </div>
                </div>

                <div class="terminal_wrap">
                    <div class="top">
                        <p class="title">仿真指令：</p>
                    </div>
                    <div class="data_set border" >
                        <textarea  type="text" style="width: 100%; height: 200px;" id="printText" name="printText" value=''></textarea >
                    </div>
                </div>

                <div class="terminal_wrap">
                    <div class="top">
                        <p class="title">信息输出：</p>
                        <button onclick="clearLog()">清空输出</button>
                    </div>
                    <div class="terminal">
                    </div>
                </div>

            </div>

        </div>
    </div>

    <div class="popup_tips" style="display: none;">
        <div class="popup_tips_mask"></div>
        <div class="popup_tips_content"></div>
    </div>
</body>

<script src="./js/jquery.js"></script>
<script src="./js/common.js"></script>
<script src="./js/base64.js"></script>


<script type="text/javascript">
    window.onload = function () {    //刷新后回到顶部
        $(window).scrollTop(0)

        $('#printText').val('^XA\n^PW600\n^LL600\n^SEE:GB18030.DAT^CI26^CWL,E:simsun.fnt\n^FO0,100^ALN,40,40^FD Print Test LABEL^FS\n^XZ');
    }

    //16进制字符转ascii码字符串
    function hexToString(hexString) {
        let string = '';
        for (let i = 0; i < hexString.length; i += 2) {
            const code = parseInt(hexString.substr(i, 2), 16);
            string += String.fromCharCode(code);
        }
        return string;
    }
    //ascii码字符串转16进制字符
    function stringToHex(str,EMU_RADIO) {
        var result = '';
        for (var i = 0; i < str.length; i++) 
        {
            let hex = str.charCodeAt(i).toString(16);
            if (hex.length < 2) {
                hex = '0' + hex;
            }
            if(EMU_RADIO == 2 && hex == '0a')//TSPL仿真的时候,需要把0a前面多增加一个0d,即把\n改为\r\n
                hex = '0d' + hex;
            result += hex;
        }
        return result;
    }

    //切换仿真不同的仿真指令
    function changeDataValue(radioType)
     {
        var textValue="";
        if(radioType == 1)//ZPL仿真
        {
            textValue = '^XA';
            textValue += '\n^PW600';
            textValue += '\n^LL600';
            textValue += '\n^SEE:GB18030.DAT^CI26^CWL,E:simsun.fnt';
            textValue += '\n^FO0,100^ALN,40,40^FD Print Test LABEL^FS';
            textValue += '\n^XZ';
        }
        else if(radioType == 2)//TSPL仿真
        {
            textValue = 'CLS';
            textValue += '\r\nSIZE 4,1';
            textValue += '\r\nTEXT 110,50,"3",0,1,1,"Print Test LABEL"';
            textValue += '\r\nPRINT 1';
            textValue += '\r\n';
        }
        else if(radioType == 3)//ESCPOS仿真
        {
            textValue = '1b401c26';
            textValue += '1d2100';                
            textValue += '1b4d00';
            textValue += '1b2d00';
            textValue += '1b4500';
            textValue += '5072696E742054657374204C4142454C';//Print Test LABEL
            textValue += '0a';                     
            textValue += '1d564100';
        }       
        $('#printText').val(textValue);
    }

    //处理参数
    function handleParams() {
        let data = {}
        $("input[name]").each(function () {
            var name = $(this).attr("name");
            var isFile = $(this).attr("type") == "file";
            var isRadio = $(this).attr("type") == "radio";
            var isCheckBox = $(this).attr("type") == "checkbox";

            if (isFile) {
                data[name] = $("input[name=" + name + "]").get(0).files[0] || "";
            } else if (isRadio) {
                data[name] = $("input[name=" + name + "]:checked").val()
            } else if (isCheckBox) {
                data[name] = $(this).is(":checked")
            } else {
                data[name] = $("input[name=" + name + "]").val() || "";
            }
        });

        return data
    }

    //打印
    async function handlePrint(type) {
        var rfidType = 0;
        let params = handleParams()
        console.log(params);
        try {
            await sendPostRequest("web_DSTP2x_SetLibLang", "设置语言", { "language":"0" })
            
            //枚举设备
            const devRes = await sendPostRequest("web_DSTP2x_EnumDev", "枚举设备", { "enumType": "1" })
            
            let index = devRes.enumList.indexOf(",")
            if(index != -1)
            {
                const devList = devRes.enumList.split(",")
                devRes.enumList = devList[0]
            }

            //连接设备
            const connectRes = await sendPostRequest("web_DSTP2x_ConnEnumeratedDev", "连接设备", { "devName": devRes.enumList })
            //获取打印状态
            const statusRes = await sendPostRequest("web_DSTP2x_GetPrtStatus", "获取打印状态", { "devHdl": connectRes.devHdl })
            if (statusRes.isReady != "1") {
                openMask("打印机状态异常", true)
                //断开连接
                await sendPostRequest("web_DSTP2x_DisconnDev", "断开连接", { "devHdl": connectRes.devHdl })
                return
            }

            //设置仿真类型
            await sendPostRequest("web_DSTP2x_SetPrnEmulation", "设置仿真类型", { "devHdl": connectRes.devHdl, "emulation": params.EMU_RADIO })
             //设置超时时间
             await sendPostRequest("web_DSTP2x_SetCommTimeout", "设置超时时间", { "devHdl": connectRes.devHdl, "commType": "1", "sendTimeout": "20000", "recvTimeout": "20000"})
            
            //仿真打印数据
            var hexInDataText ='';
            var inDataText = $('#printText').val(); 
            if(params.EMU_RADIO == 1 || params.EMU_RADIO == 2)//ZPL仿真 //TSPL仿真
                hexInDataText = stringToHex(inDataText,params.EMU_RADIO);//转成16进制字符串
            else
                hexInDataText = inDataText;//ESCPOS仿真直接填写的16进制字符串数据

            let info = {
                devHdl: connectRes.devHdl,
                inData: hexInDataText,
                isHexStr: "1",
                outDataType:"0"
            }

            printAll(info, params, 1, type)
        } catch (error) {
            let errText = error ? error : "请求失败"
            openMask(errText, true)
        }
    }

    //循环打印
    async function printAll(info, params, count, type) {
        try {
            if (count <= params.printCount) {
                //打印
                await sendPostRequest("web_DSTP2x_TransRecvData", `第${count}次打印`, { "devHdl": info.devHdl,"inData":info.inData,"isHexStr":info.isHexStr,"outDataType": info.outDataType})
                count++
                printAll(info, params, count, type)
            } else {

                //断开连接
                await sendPostRequest("web_DSTP2x_DisconnDev", "断开连接", { "devHdl": info.devHdl })
                openMask("打印成功", true)
                // reset()
            }
        } catch (error) {
            console.log(error);
            let errText = error ? error : "请求失败"
            openMask(errText, true)
        }
    }


</script>

</html>
