<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TemplatePrintOnly</title>
    <link rel="stylesheet" type="text/css" href="./css/reset.css" />
    <link rel="stylesheet" type="text/css" href="./css/style.css" />
</head>

<body>
    <div class="header">
        <img src="./images/tp.png" height="32px" style="margin-top:16px;" />
    </div>
    <div class="main">
        <span class="tag">
            TemplatePrintOnly
        </span>
        <div class="content_wrap">
            <div class="setting">
                <p class="title">模板文件(注：示例设置的ID值仅针对示例目录下模板tempTest.dlt)：</p>
                <div class="file_input border">
                    <input style="display: none;" type="file" name="tmplFileSrc" id="tmplFileSrc" />
                    <input type="text" id="tempDisplay" readonly />
                    <button onclick="chooseTemp('tmplFileSrc')">浏览</button>
                </div>               
                <p class="title">打印设置：</p>
                <div class="options border">                   
                    <div class="label">
                        <label for="printCount" style=" margin-left: 55px;margin-right: 50px">打印次数</label>
                        <input type="number" id="printCount" name="printCount" value="1">
                    </div>

                </div>

                <div class="data_set border">
                    <div class="wrap">                                        
                        <section>   
                            <label for="EMU_SEL" style=" margin-right: 50px;">仿真选择</label>    
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" id="ZPL_EMU" value="1" name="EMU_RADIO" checked>
                                <label for="ZPL" name="ZPL">ZPL</label>
                            </div>                         
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" id="TSPL_EMU" value="2" name="EMU_RADIO" >
                                <label for="TSPL" name="TSPL">TSPL</label>
                            </div>
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" id="ESCPOS_EMU" value="3" name="EMU_RADIO">
                                <label for="ESCPOS" name="ESCPOS">ESCPOS</label>
                            </div>                            
                        </section>
                    </div>
                </div>

                <div class="btn"><button class="success" onclick="handlePrint()">打印</button></div>
                <div class="terminal_wrap">
                    <div class="top">
                        <p class="title">信息输出：</p>
                        <button onclick="clearLog()">清空输出</button>
                    </div>
                    <div class="terminal border">
                    </div>
                </div>

            </div>

        </div>
    </div>


    <div class="popup_tips" style="display: none;">
        <div class="popup_tips_mask"></div>
        <div class="popup_tips_content"></div>
    </div>

</body>

<script src="./js/jquery.js"></script>
<script src="./js/common.js"></script>
<script type="text/javascript">

    window.onload = function () {    //刷新后回到顶部
        $(window).scrollTop(0)
    }

    //开始打印
    async function handlePrint() {
        var data = {};
        $("input[name]").each(function () {
            var name = $(this).attr("name");
            var isFile = $(this).attr("type") == "file";
            var isRadio = $(this).attr("type") == "radio";
            var isCheckBox = $(this).attr("type") == "checkbox";
            if (isFile) {
                data[name] = $("input[name=" + name + "]").get(0).files[0] || "";
            } else if (isCheckBox) {
                data[name] = $(this).is(":checked")
            } else if (isRadio) {
                data[name] = $("input[name=" + name + "]:checked").val()
            } else {
                data[name] = $("input[name=" + name + "]").val() || "";
            }
        });


        if (!data.tmplFileSrc) {
            openMask("请选择模板文件", true)
            return
        }

        print(await handleParams(data))
    }
    async function handleParams(data) {

        data.tmplFileSrc = await fileToBase64(data.tmplFileSrc)

        return data
    }

    var intervalObj = null;//定义一个计时器来显示批量查询状态
    var connectRes = {};//连接打印机的句柄
    var tempRes = {};//加载模板句柄

    //开始打印
    async function print(params) {
        console.log(params);
        try {
            await sendPostRequest("web_DSTP2x_SetLibLang", "设置语言", { "language":"0" })
            
            //枚举设备
            const devRes = await sendPostRequest("web_DSTP2x_EnumDev", "枚举设备", { "enumType": "1" })
            
            let index = devRes.enumList.indexOf(",")
            if(index != -1)
            {
                const devList = devRes.enumList.split(",")
                devRes.enumList = devList[0]
            }

            //连接设备
            connectRes = await sendPostRequest("web_DSTP2x_ConnEnumeratedDev", "连接设备", { "devName": devRes.enumList })

            //获取打印状态
            const statusRes = await sendPostRequest("web_DSTP2x_GetPrtStatus", "获取打印状态", { "devHdl": connectRes.devHdl })
            if (statusRes.isReady != "1") {
                openMask("打印机状态异常", true)
                //断开连接
                await sendPostRequest("web_DSTP2x_DisconnDev", "断开连接", { "devHdl": connectRes.devHdl })
                return
            }

            //加载模板
            tempRes = await sendPostRequest("web_DSTP2x_LoadLabelTmpl", "加载模板", { "tmplFileSrcType": "1", "tmplFileSrc": params.tmplFileSrc })

            //拼装打印数据 (注：此测试数据的ID值针对示例目录下模板tempTest.dlt)
            var jobs = [];
            var i=0;
            for( i=1; i <= params.printCount; i++)
            {
                var job = {};
                job.jobNo = "" + i;
                job.devHdl = connectRes.devHdl;
                job.tmplHdl = tempRes.tmplHdl;

                job.trueData = [];
                var trueDataText04 = {"elemID":"Text-04","elemKey":"Data","elemValue":""};
                trueDataText04.elemValue = "打印机" + i;
                job.trueData.push(trueDataText04);

                var trueDataText06 = {"elemID":"Text-06","elemKey":"Data","elemValue":""};
                trueDataText06.elemValue = "No0000" + i;
                job.trueData.push(trueDataText06);

                var trueDataQrCode01 = {"elemID":"QrCode-01","elemKey":"Data","elemValue":""};
                trueDataQrCode01.elemValue = "test0" + i;
                job.trueData.push(trueDataQrCode01);

                jobs.push(job);
            } 
            //批量打印
            await sendPostRequest("web_DSTP2x_BatPrnTmpl", "批量打印", {"syncType":"0", "prnTimeOut":"20000", "emulation":params.EMU_RADIO, "jobs": jobs })
            
            //通过计时器来查询批量打印状态
            if (intervalObj != undefined && intervalObj != null) {
                clearInterval(intervalObj);
                intervalObj = null;
            }
            intervalObj = setInterval(async function () {
                GetBatPrnTmplStatus(connectRes,tempRes);
            }, 1000);

        } catch (error) {
            let errText = error ? error : "请求失败"
            openMask(errText, true)
        }
    }

    //查询批量打印状态
    async function GetBatPrnTmplStatus(connectRes, tempRes)
    {
        //先关闭计时器
        if (intervalObj != undefined && intervalObj != null)
        {
            clearInterval(intervalObj);
            intervalObj = null;
        }

        var printStop = 0;
        const batPrnRst = await sendPostRequest("web_DSTP2x_GetBatPrnTmplStatus", "查询批量打印状态", {});
        if(batPrnRst.subCode == undefined || batPrnRst.subCode != "0")//查询到状态错误，有可能是打印机错误引起返回非0情况
        {
            //删除模板句柄
            await sendPostRequest("web_DSTP2x_DeleteTmpl", "删除模板句柄", { "tmplHdl": tempRes.tmplHdl })
            //断开连接
            await sendPostRequest("web_DSTP2x_DisconnDev", "断开连接", { "devHdl": connectRes.devHdl })

            openMask("打印模板失败", true);
            printStop = 1;//打印结束
        }
        else{
            if(batPrnRst.totalNum == batPrnRst.completeNum)
            {
                //删除模板句柄
                await sendPostRequest("web_DSTP2x_DeleteTmpl", "删除模板句柄", { "tmplHdl": tempRes.tmplHdl })
                //断开连接
                await sendPostRequest("web_DSTP2x_DisconnDev", "断开连接", { "devHdl": connectRes.devHdl })
                openMask("打印模板成功", true);

                printStop = 1;//打印结束
            }
        }

        //打印尚未结束,继续下一次查询
        if(printStop == 0)
        {
            intervalObj = setInterval(async function () {
                GetBatPrnTmplStatus(connectRes,tempRes);
            }, 1000);
        }
    }

</script>

</html>
