<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrawPrint_RFID</title>
    <link rel="stylesheet" type="text/css" href="./css/reset.css" />
    <link rel="stylesheet" type="text/css" href="./css/style.css" />
</head>

<body>
    <div class="header">
        <img src="./images/tp.png" height="32px" style="margin-top:16px;" />
    </div>
    <div class="main">
        <span class="tag">
            DrawPrint_RFID
        </span>
        <div class="content_wrap">
            <div class="setting">
                <p class="title">待写入的RFID数据：</p>
                <div class="data_set border">
                    <div class="wrap">
                        <section>
                            <div class="set_label" style="flex: 1; margin-right: 45px">
                                <label for="EPC" style="width: 100px;">EPC：</label>
                                <input type="text" id="EPC_Text" name="EPC_Text">
                            </div>
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" name="EPC_RADIO" id="EPC_ASCII" value="1" checked>
                                <label for="EPC_ASCII">ASCII</label>
                            </div>
                            <div class="set_label" style="margin-right: 45px">
                                <input type="radio" name="EPC_RADIO" id="EPC_hex" value="2">
                                <label for="EPC_hex">十六进制字符串</label>
                            </div>
                        </section>
                        <section>
                            <div class="set_label" style="flex: 1; margin-right: 45px">
                                <label for="USER" style="width: 100px;">USER：</label>
                                <input type="text" id="USER_Text" name="USER_Text">
                            </div>
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" id="USER_ASCII" value="1" name="USER_RADIO" checked>
                                <label for="USER_ASCII">ASCII</label>
                            </div>
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" id="USER_hex" value="2" name="USER_RADIO">
                                <label for="USER_hex" name="USER_hex">十六进制字符串</label>
                            </div>
                        </section>
                    </div>
                </div>
                <p class="title">打印设置：</p>
                <div class="options border">
                    <div class="label">
                        <label for="printCount" style=" margin-left: 55px;margin-right: 50px">打印次数</label>
                        <input type="number" id="printCount" value="1" name="printCount">
                    </div>

                </div>

                <div class="data_set border">
                    <div class="wrap">                                        
                        <section>   
                            <label for="EMU_SEL" style=" margin-right: 50px;">仿真选择</label>    
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" id="ZPL_EMU" value="1" name="EMU_RADIO" checked>
                                <label for="ZPL" name="ZPL">ZPL</label>
                            </div>                         
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" id="TSPL_EMU" value="2" name="EMU_RADIO" >
                                <label for="TSPL" name="TSPL">TSPL</label>
                            </div>
                            <div class="set_label" style=" margin-right: 45px">
                                <input type="radio" id="ESCPOS_EMU" value="3" name="EMU_RADIO">
                                <label for="ESCPOS" name="ESCPOS">ESCPOS</label>
                            </div>                            
                        </section>
                    </div>
                </div>

                <div class="btn">
                    <button class="success" onclick="handlePrint('文本打印')">文本打印</button>
                    <button class="success" onclick="handlePrint('一维条码打印')">一维条码打印</button>
                    <button class="success" onclick="handlePrint('二维条码打印')">二维条码打印</button>
                    <button class="success" onclick="handlePrint('图片打印')">图片打印</button>
                    <button class="success" onclick="handlePrint('混合内容')">混合内容</button>
                </div>
                <div class="terminal_wrap">
                    <div class="top">
                        <p class="title">信息输出：</p>
                        <button onclick="clearLog()">清空输出</button>
                    </div>
                    <div class="terminal">
                    </div>
                </div>

            </div>

        </div>
    </div>

    <div class="popup_tips" style="display: none;">
        <div class="popup_tips_mask"></div>
        <div class="popup_tips_content"></div>
    </div>
</body>

<script src="./js/jquery.js"></script>
<script src="./js/common.js"></script>
<script src="./js/base64.js"></script>


<script type="text/javascript">
    window.onload = function () {    //刷新后回到顶部
        $(window).scrollTop(0)
    }

    //处理参数
    function handleParams() {
        let data = {}
        $("input[name]").each(function () {
            var name = $(this).attr("name");
            var isFile = $(this).attr("type") == "file";
            var isRadio = $(this).attr("type") == "radio";
            var isCheckBox = $(this).attr("type") == "checkbox";

            if (isFile) {
                data[name] = $("input[name=" + name + "]").get(0).files[0] || "";
            } else if (isRadio) {
                data[name] = $("input[name=" + name + "]:checked").val()
            } else if (isCheckBox) {
                data[name] = $(this).is(":checked")
            } else {
                data[name] = $("input[name=" + name + "]").val() || "";
            }
        });

        return data
    }

    //文本打印
    async function handlePrint(type) {
        var rfidType = 0;
        let params = handleParams()
        console.log(params);
        try {
            await sendPostRequest("web_DSTP2x_SetLibLang", "设置语言", { "language":"0" })

            //枚举设备
            const devRes = await sendPostRequest("web_DSTP2x_EnumDev", "枚举设备", { "enumType": "1" })

            let index = devRes.enumList.indexOf(",")
            if(index != -1)
            {
                const devList = devRes.enumList.split(",")
                devRes.enumList = devList[0]
            }

            //连接设备
            const connectRes = await sendPostRequest("web_DSTP2x_ConnEnumeratedDev", "连接设备", { "devName": devRes.enumList })
            //获取打印状态
            const statusRes = await sendPostRequest("web_DSTP2x_GetPrtStatus", "获取打印状态", { "devHdl": connectRes.devHdl })
            if (statusRes.isReady != "1") {
                openMask("打印机状态异常", true)
                //断开连接
                await sendPostRequest("web_DSTP2x_DisconnDev", "断开连接", { "devHdl": connectRes.devHdl })
                return
            }
            //设置仿真类型
            await sendPostRequest("web_DSTP2x_SetPrnEmulation", "设置仿真类型", { "devHdl": connectRes.devHdl, "emulation": params.EMU_RADIO })

            //创建绘图画布句柄
            const labelRes = await sendPostRequest("web_DSTP2x_CreateLabelContext", "创建绘图画布句柄", { "width": "110", "height": "100" })
            if (params.EPC_Text) {
                //设置写入的RFID数据
                await sendPostRequest("web_DSTP2x_LcRfid_SetData", "设置写入的RFID数据", { "lcHdl": labelRes.lcHdl, "rfidRgnType": "1", "rfidDataFmt": params.EPC_RADIO, "data": params.EPC_Text })
                rfidType += 2
            }
            if (params.USER_Text) {
                //设置写入的RFID数据
                await sendPostRequest("web_DSTP2x_LcRfid_SetData", "设置写入的RFID数据", { "lcHdl": labelRes.lcHdl, "rfidRgnType": "2", "rfidDataFmt": params.USER_RADIO, "data": params.USER_Text })
                rfidType += 4;
            }

            const res = await drawPrintData(type, connectRes.devHdl, labelRes.lcHdl)
            let info = {
                devHdl: connectRes.devHdl,
                lcHdl: labelRes.lcHdl,
                tblHdl: res.tblHdl ? res.tblHdl : "",
                rfidType
            }
            printAll(info, params, 1, type)
        } catch (error) {
            let errText = error ? error : "请求失败"
            openMask(errText, true)
        }
    }

    //设置打印参数
    function drawPrintData(type, devHdl, lcHdl) {
        return new Promise(async function (resolve, reject) {
            try {
                //设置超时时间
                await sendPostRequest("web_DSTP2x_SetCommTimeout", "设置超时时间", {
                    "devHdl": devHdl, "commType": "1", "sendTimeout": "20000", "recvTimeout": "20000"
                })
                if (type == "文本打印") {
                    //设置字体类型
                    await sendPostRequest("web_DSTP2x_LcDraw_SetTextFontName", "设置字体类型", { "lcHdl": lcHdl, "temporary": "1", "fontName": "宋体" })
                    //设置字体大小
                    await sendPostRequest("web_DSTP2x_LcDraw_SetTextFontSize", "设置字体大小", { "lcHdl": lcHdl, "temporary": "0", "fontSize": "20.0" })
                    //设置对齐方式
                    await sendPostRequest("web_DSTP2x_LcDraw_SetTextHAlign", "设置对齐方式", { "lcHdl": lcHdl, "temporary": "0", "align": "2", xLine: "10.0" })
                    //设置是否斜体
                    await sendPostRequest("web_DSTP2x_LcDraw_SetTextItalic", "设置是否斜体", { "lcHdl": lcHdl, "temporary": "0", "isItalic": "0" })
                    //设置文字行距
                    await sendPostRequest("web_DSTP2x_LcDraw_SetTextLineSpacing", "设置文字行距", { "lcHdl": lcHdl, "temporary": "0", "align": "2", spacing: "1.0" })
                    //设置文字旋转
                    await sendPostRequest("web_DSTP2x_LcDraw_SetTextRotation", "设置文字旋转", { "lcHdl": lcHdl, "temporary": "0", "angle": "0", anchorPoint: "3" })
                    //设置字间距
                    await sendPostRequest("web_DSTP2x_LcDraw_SetTextCharSpacing", "设置字间距", { "lcHdl": lcHdl, "temporary": "0", "spacing": "1.0" })
                    //设置是否加粗
                    await sendPostRequest("web_DSTP2x_LcDraw_SetTextBold", "设置是否加粗", { "lcHdl": lcHdl, "temporary": "0", "isBold": "1" })
                    //设置是否换行
                    await sendPostRequest("web_DSTP2x_LcDraw_SetTextAutoLineFeed", "设置是否换行", { "lcHdl": lcHdl, "temporary": "0", "isAutoLineFeed": "1" })
                    //写入文本内容
                    await sendPostRequest("web_DSTP2x_Lbl_DrawText", "写入文本内容", { "lcHdl": lcHdl, "x": "0", "y": "0", "w": "40", "h": "40", "data": "Test Test Test" })
                    resolve({})
                }
                if (type == "一维条码打印") {
                    //条码是否生成注释
                    await sendPostRequest("web_DSTP2x_LcDraw_SetBarCodeExpl", "是否生成注释", { "lcHdl": lcHdl, "temporary": "1", "explanation": "1" })
                    //写入一维条码内容
                    await sendPostRequest("web_DSTP2x_Lbl_DrawBarCode", "写入一维条码内容", { "lcHdl": lcHdl, "x": "0", "y": "0", "w": "40", "h": "20", "data": "1234", "codeType": "8" })
                    resolve({})
                }
                if (type == "二维条码打印") {
                    //设置纠错级别
                    await sendPostRequest("web_DSTP2x_LcDraw_SetBarCodeEcLvl", "设置纠错级别", { "lcHdl": lcHdl, "temporary": "1", "errorCorrectLevel": "3" })
                    //写入二维条码内容
                    await sendPostRequest("web_DSTP2x_Lbl_DrawBarCode", "写入二维条码内容", { "lcHdl": lcHdl, "x": "0", "y": "0", "w": "40", "h": "40", "data": "5678", "codeType": "58" })
                    resolve({})
                }
                if (type == "图片打印") {
                    //设置图片旋转
                    await sendPostRequest("web_DSTP2x_LcDraw_SetImageRotation", "设置图片旋转", { "lcHdl": lcHdl, "temporary": "1", "angle": "90", "anchorPoint": "3" })
                    //设置图片算法
                    await sendPostRequest("web_DSTP2x_LcDraw_SetImageHalftoneAlgo", "设置图片算法", { "lcHdl": lcHdl, "temporary": "1", "algorithm": "3", "threshold": "175" })
                    //写入图片内容
                    await sendPostRequest("web_DSTP2x_Lbl_DrawImage", "写入图片内容", { "lcHdl": lcHdl, "x": "0", "y": "0", "w": "40", "h": "40", "data": imageBa64, "imgDataType": "2" })
                    resolve({})
                }
                if (type == "混合内容") {
                    //设置字体类型
                    await sendPostRequest("web_DSTP2x_LcDraw_SetTextFontName", "设置字体类型", { "lcHdl": lcHdl, "temporary": "1", "fontName": "宋体" })
                    //写入文本内容
                    await sendPostRequest("web_DSTP2x_Lbl_DrawText", "写入文本内容", { "lcHdl": lcHdl, "x": "0", "y": "0", "w": "40", "h": "40", "data": "Test Test Test" })
                    //写入一维条码内容
                    await sendPostRequest("web_DSTP2x_Lbl_DrawBarCode", "写入一维条码内容", { "lcHdl": lcHdl, "x": "20", "y": "0", "w": "40", "h": "20", "data": "1234", "codeType": "8" })
                    //写入二维条码内容
                    await sendPostRequest("web_DSTP2x_Lbl_DrawBarCode", "写入二维条码内容", { "lcHdl": lcHdl, "x": "30", "y": "0", "w": "40", "h": "40", "data": "5678", "codeType": "58" })
                    //写入图片内容
                    await sendPostRequest("web_DSTP2x_Lbl_DrawImage", "写入图片内容", { "lcHdl": lcHdl, "x": "40", "y": "0", "w": "40", "h": "40", "data": imageBa64, "imgDataType": "2" })
                    //创建表格
                    const tableRes = await sendPostRequest("web_DSTP2x_CreateTable", "创建表格", {
                        "lcHdl": lcHdl, "x": "50", "y": "0", "w": "40", "h": "40", "rowCount": "3", "colCount": "2", "lineWidth": "1"
                    })
                    resolve(tableRes)
                }
            } catch (error) {
                reject(error)
            }
        })


    }

    //循环打印
    async function printAll(info, params, count, type) {
        try {
            if (count <= params.printCount) {
                //打印
                await sendPostRequest("web_DSTP2x_PrintLc", `第${count}次打印`, { "devHdl": info.devHdl, "lcHdl": info.lcHdl, "outFileType": "0", "rfidReadType": info.rfidType + "" })
                count++
                printAll(info, params, count, type)
            } else {
                if (type == "混合内容") {
                    //删除表格
                    await sendPostRequest("web_DSTP2x_DeleteTable", "删除表格", { "tblHdl": info.tblHdl })
                }
                //删除绘图画布句柄
                await sendPostRequest("web_DSTP2x_DeleteLabelContext", "删除绘图画布句柄", { "lcHdl": info.lcHdl })
                //断开连接
                await sendPostRequest("web_DSTP2x_DisconnDev", "断开连接", { "devHdl": info.devHdl })
                openMask("打印成功", true)
                // reset()
            }
        } catch (error) {
            console.log(error);
            let errText = error ? error : "请求失败"
            openMask(errText, true)
        }
    }


</script>

</html>
